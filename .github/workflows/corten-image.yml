# Corten Logistics: builds the Corten-branded Tymeslot image (the database-free
# "release-slim" target) and publishes it to GitHub Container Registry.
# Railway's `tymeslot` service runs ghcr.io/automate-everything-today/corten-meet.
name: Corten image

on:
  push:
    branches: [corten]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: corten-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/automate-everything-today/corten-meet

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Read version from mix.exs
        id: version
        run: |
          VERSION=$(grep -m 1 'version:' mix.exs | sed 's/.*version: "\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push slim image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.docker
          target: release-slim
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}-corten
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Corten Logistics booking (based on Tymeslot)
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=corten
          cache-to: type=gha,scope=corten,mode=max
